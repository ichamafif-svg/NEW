name: TCB laboratory phase 3 (non-privileged)
on:
  push:
    branches:
      - research/tcb-lab-scope-frozen
  workflow_dispatch:
permissions:
  contents: read
jobs:
  adversarial:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: sudo apt-get update -qq && sudo apt-get install -y libseccomp2
      - run: python -m pip install -r requirements.txt
      - name: Run G1 probes
        run: python tcb_lab/experiments/g1_decision_probes.py | tee g1-output.json
      - name: Run P3 signed-core attacks
        run: python tcb_lab/experiments/p3_signed_core.py | tee p3-output.json
      - name: Run P3 effect-boundary attacks
        run: python tcb_lab/experiments/p3_effect_line.py | tee p3-effects-output.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: tcb-lab-g1-p3-results
          path: |
            g1-output.json
            p3-output.json
            p3-effects-output.json
          if-no-files-found: warn
