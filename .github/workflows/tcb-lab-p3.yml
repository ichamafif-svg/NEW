name: TCB laboratory phase 3 (non-privileged)
on:
  push:
    branches:
      - research/tcb-lab-scope-frozen
  workflow_dispatch:
permissions:
  contents: read
jobs:
  adversarial:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: sudo apt-get update -qq && sudo apt-get install -y libseccomp2
      - run: python -m pip install -r requirements.txt
      - name: Run G1 probes
        id: g1
        continue-on-error: true
        shell: bash
        run: python tcb_lab/experiments/g1_decision_probes.py | tee g1-output.json
      - name: Run P3 signed-core attacks
        id: signed
        continue-on-error: true
        shell: bash
        run: python tcb_lab/experiments/p3_signed_core.py | tee p3-output.json
      - name: Run P3 effect-boundary attacks
        id: effects
        continue-on-error: true
        shell: bash
        run: python tcb_lab/experiments/p3_effect_line.py | tee p3-effects-output.json
      - name: Run 30 signed mutation attacks
        id: mutation
        continue-on-error: true
        shell: bash
        run: python tcb_lab/experiments/p3_mutation_fuzz.py | tee p3-mutation-output.json
      - name: Run ten autonomy safety/liveness probes
        id: autonomy
        continue-on-error: true
        shell: bash
        run: python tcb_lab/experiments/p3_autonomy.py | tee p3-autonomy-output.json
      - name: Run compositional adversarial sequences
        id: compositions
        continue-on-error: true
        shell: bash
        run: python tcb_lab/experiments/p3_compositions.py | tee p3-compositions-output.json
      - name: Run paired adversarial counterexperiments
        id: counter
        continue-on-error: true
        shell: bash
        run: python tcb_lab/experiments/p3_counterexperiments.py | tee p3-counter-output.json
      - name: Run long-horizon seeded autonomous sequences
        id: longhorizon
        continue-on-error: true
        shell: bash
        run: python tcb_lab/experiments/p3_long_horizon.py | tee p3-long-horizon-output.json
      - name: Run O1 withdrawal diagnostic
        id: o1
        continue-on-error: true
        shell: bash
        run: python tcb_lab/experiments/p3_priority_o1.py | tee p3-priority-o1-output.json
      - name: Run E1 uncertain effects
        id: e1
        continue-on-error: true
        shell: bash
        run: python tcb_lab/experiments/p3_priority_e1.py | tee p3-priority-e1-output.json
      - name: Run P1 signed false proof
        id: p1
        continue-on-error: true
        shell: bash
        run: python tcb_lab/experiments/p3_priority_p1.py | tee p3-priority-p1-output.json
      - name: P1 deeper signed proof comparisons
        id: proofdepth
        continue-on-error: true
        shell: bash
        run: python tcb_lab/experiments/p3_depth_proof.py | tee p3-depth-proof.json
      - name: E1 deeper effect retry contrasts
        id: effectdepth
        continue-on-error: true
        shell: bash
        run: python tcb_lab/experiments/p3_depth_effect.py | tee p3-depth-effect.json
      - name: O1 repeated withdrawal comparisons
        id: autonomydepth
        continue-on-error: true
        shell: bash
        run: python tcb_lab/experiments/p3_depth_autonomy.py | tee p3-depth-autonomy.json
      - name: Phase III monotone-time effect replays
        id: iii_effect
        continue-on-error: true
        shell: bash
        run: python tcb_lab/experiments/p3_iii_effect_clock.py | tee p3-iii-effect.json
      - name: Phase III subject lifecycle timeline
        id: iii_autonomy
        continue-on-error: true
        shell: bash
        run: python tcb_lab/experiments/p3_iii_autonomy_subjects.py | tee p3-iii-autonomy.json
      - name: Phase III epistemic signature contrasts
        id: iii_proof
        continue-on-error: true
        shell: bash
        run: python tcb_lab/experiments/p3_iii_proof_epistemic.py | tee p3-iii-proof.json
      - name: Phase IV boundary discriminating probes
        id: iv_boundary
        continue-on-error: true
        shell: bash
        run: python tcb_lab/experiments/p3_iv_boundary_probes.py | tee p3-iv-boundary.json
      - name: Phase IV boundary matrix coverage audit
        id: iv_matrix
        continue-on-error: true
        shell: bash
        run: python tcb_lab/experiments/p3_iv_coverage_audit.py | tee p3-iv-matrix.json
      - name: Phase IV-B paired boundary counterexperiments
        id: ivb_pairs
        continue-on-error: true
        shell: bash
        run: python tcb_lab/experiments/p3_ivb_boundary_pairs.py | tee p3-ivb-pairs.json
      - name: IV-C audit unresolved boundary classifications
        id: ivc_scope
        continue-on-error: true
        shell: bash
        run: python tcb_lab/experiments/p3_ivc_scope_audit.py | tee p3-ivc-scope.json
      - name: IV-C repeated same target autonomy traces
        id: ivc_target
        continue-on-error: true
        shell: bash
        run: python tcb_lab/experiments/p3_ivc_same_target.py | tee p3-ivc-target.json
      - name: IV-D G08/G16 longitudinal obligations and autonomy
        id: ivd_g0816
        continue-on-error: true
        shell: bash
        run: python tcb_lab/experiments/p3_ivd_g08_g16.py | tee p3-ivd-g0816.json
      - name: IV-E G08/G16 planning and withdrawal reasons
        id: ive_reasons
        continue-on-error: true
        shell: bash
        run: python tcb_lab/experiments/p3_ive_g08_g16_plan.py | tee p3-ive-reasons.json
      - name: IV-F G08/G16 24-hour backoff contrast
        id: ivf_backoff
        continue-on-error: true
        shell: bash
        run: python tcb_lab/experiments/p3_ivf_backoff.py | tee p3-ivf-backoff.json
      - name: IV-G G08/G16 health and 48h escalation
        id: ivg_health
        continue-on-error: true
        shell: bash
        run: python tcb_lab/experiments/p3_ivg_health_escalation.py | tee p3-ivg-health.json
      - name: IV-H G08 target:vulns canonical obligation and G16 escalation
        id: ivh_canonical
        continue-on-error: true
        shell: bash
        run: python tcb_lab/experiments/p3_ivh_canonical_vulns.py | tee p3-ivh-canonical.json
      - name: IV-I G16 seven-day deadline crossing
        id: ivi_deadline
        continue-on-error: true
        shell: bash
        run: python tcb_lab/experiments/p3_ivi_g16_deadline.py | tee p3-ivi-deadline.json
      - name: Validate all experiment reports are parseable JSON
        id: jsoncheck
        continue-on-error: true
        shell: bash
        run: |
          for file in g1-output.json p3-output.json p3-effects-output.json p3-mutation-output.json p3-autonomy-output.json p3-compositions-output.json p3-counter-output.json p3-long-horizon-output.json p3-priority-o1-output.json p3-priority-e1-output.json p3-priority-p1-output.json p3-depth-proof.json p3-depth-effect.json p3-depth-autonomy.json p3-iii-effect.json p3-iii-autonomy.json p3-iii-proof.json p3-iv-boundary.json p3-iv-matrix.json p3-ivb-pairs.json p3-ivc-scope.json p3-ivc-target.json p3-ivd-g0816.json p3-ive-reasons.json p3-ivf-backoff.json p3-ivg-health.json p3-ivh-canonical.json p3-ivi-deadline.json; do
            test -s "$file" || exit 1
            python -m json.tool "$file" > /dev/null || exit 1
          done
      - name: Reject any failed suite, while retaining all suite outputs
        if: always() && (steps.g1.outcome == 'failure' || steps.signed.outcome == 'failure' || steps.effects.outcome == 'failure' || steps.mutation.outcome == 'failure' || steps.autonomy.outcome == 'failure' || steps.compositions.outcome == 'failure' || steps.counter.outcome == 'failure' || steps.longhorizon.outcome == 'failure' || steps.o1.outcome == 'failure' || steps.e1.outcome == 'failure' || steps.p1.outcome == 'failure' || steps.proofdepth.outcome == 'failure' || steps.effectdepth.outcome == 'failure' || steps.autonomydepth.outcome == 'failure' || steps.jsoncheck.outcome == 'failure' || steps.iii_effect.outcome == 'failure' || steps.iii_autonomy.outcome == 'failure' || steps.iii_proof.outcome == 'failure' || steps.iv_boundary.outcome == 'failure' || steps.iv_matrix.outcome == 'failure' || steps.ivb_pairs.outcome == 'failure' || steps.ivc_scope.outcome == 'failure' || steps.ivc_target.outcome == 'failure' || steps.ivd_g0816.outcome == 'failure' || steps.ive_reasons.outcome == 'failure' || steps.ivf_backoff.outcome == 'failure' || steps.ivg_health.outcome == 'failure' || steps.ivh_canonical.outcome == 'failure' || steps.ivi_deadline.outcome == 'failure')
        run: exit 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: tcb-lab-g1-p3-results
          path: |
            g1-output.json
            p3-output.json
            p3-effects-output.json
            p3-mutation-output.json
            p3-autonomy-output.json
            p3-compositions-output.json
            p3-counter-output.json
            p3-long-horizon-output.json
            p3-priority-o1-output.json
            p3-priority-e1-output.json
            p3-priority-p1-output.json
            p3-depth-proof.json
            p3-depth-effect.json
            p3-depth-autonomy.json
            p3-iii-proof.json
            p3-iv-boundary.json
            p3-iv-matrix.json
            p3-ivb-pairs.json
            p3-ivc-scope.json
            p3-ivc-target.json
            p3-ivd-g0816.json
            p3-ive-reasons.json
            p3-ivf-backoff.json
            p3-ivg-health.json
            p3-ivh-canonical.json
            p3-ivi-deadline.json
            p3-iii-autonomy.json
            p3-iii-effect.json
          if-no-files-found: warn

  report:
    name: Publish TCB test results (automatic)
    if: always()
    needs: [adversarial]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      issues: write
    env:
      TEST_JOB_RESULT: ${{ needs.adversarial.result }}
      REPORT_RUN_ID: ${{ github.run_id }}
      REPORT_RUN_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
      - name: Download available run reports, no manual exports
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p p3-artifacts
          gh run download "$REPORT_RUN_ID" --name tcb-lab-g1-p3-results --dir p3-artifacts || true
      - name: Retrieve repository workflow history, including red runs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs?per_page=100" > ci-history.json
      - name: Build complete concise report
        run: python3 tcb_lab/ci_report.py
      - name: Update one persistent GitHub issue with latest report
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TITLE="TCB laboratory - automated execution register"
          gh issue list --state all --limit 100 --json number,title > issue-index.json
          ISSUE_NUMBER=$(python3 -c 'import json; print(next((i["number"] for i in json.load(open("issue-index.json")) if i["title"] == "TCB laboratory - automated execution register"), ""))')
          if [ -n "$ISSUE_NUMBER" ]; then
            gh issue edit "$ISSUE_NUMBER" --body-file ci-summary.md
          else
            gh issue create --title "$TITLE" --body-file ci-summary.md
          fi
          cat ci-summary.md >> "$GITHUB_STEP_SUMMARY"
