name: Hybrid kernel prototype checks
on:
  push:
    branches: [prototype/hybrid-kernel-v1]
    paths:
      - 'hybrid_kernel/**'
      - 'tests/test_hybrid_kernel*.py'
      - '.github/workflows/hybrid-kernel-prototype.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Setup project dependencies
        run: python -m pip install -r requirements.txt
      - name: Run hybrid and trusted-runtime integration tests
        run: python -m unittest discover -s tests -p 'test_hybrid_kernel*.py' -v
      - name: Run legacy constitutional regressions
        run: python -m unittest discover -s tests -p 'test_kernel*.py' -v
      - name: Check release-readiness inventory (blocked until independently verified)
        run: python -m hybrid_kernel.release_gate
