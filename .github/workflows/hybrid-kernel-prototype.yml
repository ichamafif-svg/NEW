name: Hybrid kernel prototype checks
on:
  push:
    branches: [prototype/hybrid-kernel-v1]
    paths:
      - 'hybrid_kernel/**'
      - 'maintenance/**'
      - 'standard/**'
      - 'ops/**'
      - 'demo/**'
      - 'tcb/**'
      - 'bootstrap.py'
      - 'tools/check_tcb.py'
      - 'tcb-budget.json'
      - 'tests/test_standard*.py'
      - 'Makefile'
      - 'tests/test_hybrid_kernel*.py'
      - 'tests/test_standard_service.py'
      - '.github/workflows/hybrid-kernel-prototype.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Setup project dependencies
        run: python -m pip install -r requirements.txt
      - name: Check effective trust budgets and all constitutional regressions
        run: make check
      - name: Check release-readiness inventory (blocked until independently verified)
        run: python -m hybrid_kernel.release_gate
